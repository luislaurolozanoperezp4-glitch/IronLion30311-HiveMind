# Builds the robot app and runs the JUnit tests on every push and pull request to main and dev.
# It can also be started by hand (Actions tab -> Build -> Run workflow, or
# `gh workflow run build.yml --ref <branch>`).
name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # AGP 8.x / Gradle 9.1 need JDK 17 or newer; the FTC SDK compiles Java 8 bytecode with it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Caches Gradle dependencies and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            TeamCode/build/reports/tests/
            TeamCode/build/test-results/
          if-no-files-found: ignore

  code-rules:
    # Fast grep checks for project rules (no build needed). See .github/scripts/check-code-rules.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check code rules
        run: bash .github/scripts/check-code-rules.sh

  branch-name:
    # Rejects pull requests whose branch name breaks docs/BRANCHING.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          regex='^(main|dev|(feat|fix|auto|path|tune|refactor|test|docs|ci|chore|hotfix|agent)/[a-z0-9]+(-[a-z0-9]+)*)$'
          if [[ ! "$BRANCH" =~ $regex ]] || [ ${#BRANCH} -gt 30 ]; then
            echo "Branch '$BRANCH' does not follow docs/BRANCHING.md (type/short-kebab-name, max 30 chars)."
            exit 1
          fi
          echo "Branch name OK: $BRANCH"
