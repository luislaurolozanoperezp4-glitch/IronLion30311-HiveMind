// FTC SDK 12.0.0 (FtcRobotController v12.0) + Pedro Pathing 3.0.2 + FTC Dashboard.
repositories {
    mavenCentral()
    google() // Needed for androidx
    maven { url = 'https://maven.brott.dev/' } // FTC Dashboard
    maven { url = 'https://repo.dairy.foundation/releases/' } // Sloth, needed by Pedro AutoTune
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    // Live telemetry graphs and tunable @Config values in a browser: http://192.168.43.1:8080/dash
    implementation('com.acmerobotics.dashboard:dashboard:0.6.0') {
        exclude group: 'org.firstinspires.ftc'
    }

    // Pedro Pathing 3 (path following for Autonomous), from Maven Central
    implementation 'com.pedropathing:revhub:3.0.2'
    // Pedro AutoTune: robot-hosted tuning page at http://192.168.43.1:10158
    implementation 'com.pedropathing:tuning:1.0.3'
}
